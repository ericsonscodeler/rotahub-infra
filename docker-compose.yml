services:
  orders-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rotahub_orders
      POSTGRES_USER: rotahub
      POSTGRES_PASSWORD: rotahub
    ports:
      - "5432:5432"
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data

  tracking-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: rotahub
      MONGO_INITDB_ROOT_PASSWORD: rotahub
      MONGO_INITDB_DATABASE: rotahub_tracking
    ports:
      - "27017:27017"
    volumes:
      - tracking-mongo-data:/data/db

  routing-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rotahub_routing
      POSTGRES_USER: rotahub
      POSTGRES_PASSWORD: rotahub
    ports:
      - "5433:5432"
    volumes:
      - routing-postgres-data:/var/lib/postgresql/data

  notification-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rotahub_notifications
      POSTGRES_USER: rotahub
      POSTGRES_PASSWORD: rotahub
    ports:
      - "5434:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: rotahub
      RABBITMQ_DEFAULT_PASS: rotahub
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  orders-postgres-data:
  tracking-mongo-data:
  routing-postgres-data:
  notification-postgres-data:
