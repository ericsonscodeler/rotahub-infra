info:
  name: Update order status
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{ordersBaseUrl}}/orders/{{orderId}}/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "CANCELLED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
