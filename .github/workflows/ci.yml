name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Validate Postman collection JSON
        run: node -e "JSON.parse(require('fs').readFileSync('rotahub.postman_collection.json','utf8'))"
